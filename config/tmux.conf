# ccm — private tmux server config (socket: tmux -L ccm), isolated from any other tmux use
set -g mouse on
set -s escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -s extended-keys on
set -g history-limit 50000
set -g focus-events on

# pane titles on the border so the 2x2 grid is readable
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour238"
# each pane has its own colour: unfocused = dim title bar + top line, focused = bright bold bar + line + border
set -g pane-border-format "#{?pane_active,#[bg=#{@ccm_color}#,fg=colour16#,bold] ▶ #{?#{@ccm_title},#{@ccm_title},#{pane_current_command}} #[default]#[fg=#{@ccm_color}#,bold]━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━,#[bg=#{@ccm_dim}#,fg=colour252] #{?#{@ccm_title},#{@ccm_title},#{pane_current_command}} #[default]#[fg=#{@ccm_dim}]━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━}"
set -g pane-active-border-style "fg=colour214"
set-hook -g after-select-pane 'set -wF pane-active-border-style "fg=#{?@ccm_color,#{@ccm_color},colour214}"'
set-hook -g pane-focus-in 'set -wF pane-active-border-style "fg=#{?@ccm_color,#{@ccm_color},colour214}"'
set-hook -g session-window-changed 'set -wF pane-active-border-style "fg=#{?@ccm_color,#{@ccm_color},colour214}"'

# status bar: clickable window tabs + key hints
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] ccm #[default] "
set -g status-right " F1 sessions · F2 zoom · F3 next grid · F4 close · F5 sidebar · click to focus "
set -g status-right-length 100
set -g window-status-current-style "bg=colour214,fg=colour235,bold"

# no-prefix keys
bind -n F1 select-window -t :0
bind -n F2 resize-pane -Z
bind -n F3 next-window
bind -n F4 kill-pane
bind -n F5 run-shell '~/.local/bin/ccm --toggle-sidebar #{window_id}'

# re-tile the grid whenever a pane goes away
set-hook -g pane-exited "run-shell '~/.local/bin/ccm --retile #{window_id}'"
set-hook -g after-kill-pane "run-shell '~/.local/bin/ccm --retile #{window_id}'"
set-hook -g client-resized "run-shell '~/.local/bin/ccm --retile #{window_id}'"
